<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>GeoAR.js - Cofre Zelda</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js'></script>
<script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js'></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene 
    embedded 
    vr-mode-ui="enabled: false" 
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
    renderer="antialias: true; alpha: true"
  >
    <a-assets>
      <a-asset-item id="cofre" src="assets/cofre_zelda/scene.gltf"></a-asset-item>
    </a-assets>

    <!-- Modelo 3D del cofre -->
    <a-entity id="cofre-model" 
      gps-new-entity-place="latitude: 37.7749; longitude: -122.4194" 
      gltf-model="#cofre"
      scale="1 1 1"
      animation-mixer
      visible="false"
    ></a-entity>

    <!-- Mensaje de proximidad -->
    <a-entity id="mensaje" position="0 2 -5" text="value: Acércate al cofre para verlo; align: center; color: red; width: 4"></a-entity>
  </a-scene>

  <script>
    const TARGET_LAT = 37.7749; // Coordenadas del cofre
    const TARGET_LON = -122.4194;
    const PRECISION = 0.00005; // Radio de proximidad (~5m)
    
    const cofreModel = document.querySelector("#cofre-model");
    const mensaje = document.querySelector("#mensaje");

    function checkUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            const distance = getDistance(latitude, longitude, TARGET_LAT, TARGET_LON);

            if (distance <= PRECISION) {
              cofreModel.setAttribute("visible", "true");
              mensaje.setAttribute("visible", "false");
            } else {
              cofreModel.setAttribute("visible", "false");
              mensaje.setAttribute("visible", "true");
            }
          },
          (error) => console.error("Error obteniendo la ubicación:", error),
          { enableHighAccuracy: true }
        );
      }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Radio de la Tierra en metros
      const φ1 = lat1 * (Math.PI / 180);
      const φ2 = lat2 * (Math.PI / 180);
      const Δφ = (lat2 - lat1) * (Math.PI / 180);
      const Δλ = (lon2 - lon1) * (Math.PI / 180);

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    function adjustObjectPosition(event) {
      if (!cofreModel.getAttribute("visible")) return;

      const { beta, gamma } = event; // Inclinación del dispositivo
      const xOffset = gamma / 90; // Movimiento horizontal
      const yOffset = beta / 180; // Movimiento vertical

      cofreModel.setAttribute("position", `${xOffset} ${yOffset} 0`);
    }

    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", adjustObjectPosition);
    }

    checkUserLocation();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesoro</title>

  <!-- ********* Bootstrap ************** -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- ##################*********************** Libraries VR A-Aframe ************************################## -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- **************** Librari AR.js A-Frame components ******************* -->
  <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js'></script>
  <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js'></script>
  <!-- *********** library for Animation mixer ***********  -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v7.5.0/dist/aframe-extras.loaders.min.js"></script>
  <!-- ##################*********************** Libraries VR A-Aframe ************************################## -->
</head>

  <body>
    
    <a-scene 
      cursor="rayOrigin: mouse"
      vr-mode-ui="enabled: false"
      arjs='sourceType: webcam; videoTexture: true; debugUIEnabled: false'
      renderer="antialias: true; alpha: true"
    >

      <!-- ******* Camera GPS ********* -->
      <a-camera gps-new-camera='gpsMinDistance: 5' rotation-reader></a-camera>
      
      
    </a-scene>

    <!-- *********************** Scripts and functions *************************-->
    <script src="main.js"></script>
  </body>

</html>
